<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Данные с Google Sheets</title>
</head>
<body>
  <h1>Температура и Дата</h1>
  <table id="data-table" border="1"></table>

  <script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/1xbnreTq5p-QOFPHQMn-s9g7C3m7P87mNYJxGeNji29k/edit?usp=sharing';

    fetch(csvUrl)
      .then(response => response.text())
      .then(data => {
        const rows = data.split('\n');
        const table = document.getElementById('data-table');

        rows.forEach((row, rowIndex) => {
          const tr = document.createElement('tr');
          row.split(',').forEach(cell => {
            const td = document.createElement(rowIndex === 0 ? 'th' : 'td');
            td.textContent = cell.trim();
            tr.appendChild(td);
          });
          table.appendChild(tr);
        });
      });
  </script>
</body>
</html>
